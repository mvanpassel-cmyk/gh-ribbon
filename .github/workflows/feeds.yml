name: Harvest feeds

on:
  schedule:
    - cron: "17 * * * *"      # elk uur op :17 (niet op het hele uur: minder druk)
  workflow_dispatch:           # knop in de Actions-tab om handmatig te draaien
  push:
    paths:
      - "fetch_feeds.py"
      - ".github/workflows/feeds.yml"

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser

      - name: Harvest
        run: python fetch_feeds.py

      - name: Commit als er iets veranderd is
        run: |
          git config user.name  "gh-ribbon-bot"
          git config user.email "actions@github.com"
          git add data/feeds.json data/archive.csv
          if git diff --staged --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "feeds: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
