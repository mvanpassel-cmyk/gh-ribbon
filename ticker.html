<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GH Ribbon — Live</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@600;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:#020905; --border:#1c2e1f; --accent:#3dff9a; --muted:#3a5240; --bright:#e8f5ee;
  --who:#29b6f6; --promed:#ffd740; --emerg:#ff7043; --global:#ab8eff;
  --amr:#ff5c8a; --journal:#e53935; --policy:#ff8f00; --news:#26a69a;
  --h: 58px;                       /* hoogte van de balk */
}

html, body { height:100%; overflow:hidden; background:var(--bg); }
body {
  font-family:'Space Mono', monospace;
  display:flex; align-items:center;
  -webkit-user-select:none; user-select:none;
  /* Maakt de balk versleepbaar als hij in een frameless Electron-venster zit */
  -webkit-app-region: drag;
}

.bar { position:relative; width:100%; height:var(--h); overflow:hidden;
       border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
.bar::before, .bar::after {
  content:''; position:absolute; top:0; bottom:0; width:90px; z-index:2; pointer-events:none;
}
.bar::before { left:66px; background:linear-gradient(to right, var(--bg) 40%, transparent); }
.bar::after  { right:0;   background:linear-gradient(to left,  var(--bg) 40%, transparent); }

.badge-live {
  position:absolute; left:0; top:0; bottom:0; width:66px; z-index:3;
  background:var(--accent); color:#020905;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:9px; font-weight:700; letter-spacing:.18em; line-height:1.6;
}
.badge-live .n { font-size:8px; opacity:.65; letter-spacing:.06em; }

.track { display:flex; align-items:center; height:100%; padding-left:80px; white-space:nowrap; width:max-content; }
.track.run { animation: scroll var(--dur, 240s) linear infinite; }
.bar:hover .track.run { animation-play-state: paused; }
@keyframes scroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }

.it {
  display:inline-flex; align-items:center; gap:11px; padding:0 30px;
  border-right:1px solid var(--border); text-decoration:none; flex-shrink:0;
  -webkit-app-region: no-drag;      /* links blijven klikbaar */
}
.pip { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.it[data-c="who"]     .pip { background:var(--who); }
.it[data-c="promed"]  .pip { background:var(--promed); }
.it[data-c="emerg"]   .pip { background:var(--emerg); }
.it[data-c="global"]  .pip { background:var(--global); }
.it[data-c="amr"]     .pip { background:var(--amr); }
.it[data-c="journal"] .pip { background:var(--journal); }
.it[data-c="policy"]  .pip { background:var(--policy); }
.it[data-c="news"]    .pip { background:var(--news); }

.src { font-size:10px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; flex-shrink:0; }
.hl  { font-size:17px; font-weight:700; color:var(--bright); transition:color .15s; }
.it:hover .hl { color:var(--accent); }
.age { font-size:10px; color:var(--muted); flex-shrink:0; }

.msg { padding-left:88px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<div class="bar">
  <div class="badge-live">LIVE<span class="n" id="n">—</span></div>
  <div class="track" id="tk"><span class="msg">GH Ribbon laden…</span></div>
</div>

<script>
// Losse ticker. Leest dezelfde data/feeds.json als de hoofdpagina.
// Bedoeld om permanent in beeld te staan: los venster, tweede scherm,
// of als frameless always-on-top venster via Electron (zie desktop/).
const DATA = 'data/feeds.json';

// ?speed=slow|normal|fast  en  ?cat=who,amr,policy  om te filteren
const P     = new URLSearchParams(location.search);
const SPEED = { slow: 400, normal: 240, fast: 140 }[P.get('speed') || 'normal'] || 240;
const ONLY  = (P.get('cat') || '').split(',').filter(Boolean);

const esc = u => (u || '#').replace(/"/g, '%22').replace(/'/g, '%27');
const he  = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function age(s) {
  if (!s) return '';
  const d = new Date(s); if (isNaN(d)) return '';
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 60)   return m + 'm';
  if (m < 1440) return Math.floor(m / 60) + 'u';
  return Math.floor(m / 1440) + 'd';
}

function interleave(items) {
  const g = {};
  items.forEach(i => { (g[i.cat] = g[i.cat] || []).push(i); });
  const gs = Object.values(g), out = [], max = Math.max(0, ...gs.map(a => a.length));
  for (let i = 0; i < max; i++) gs.forEach(a => { if (a[i]) out.push(a[i]); });
  return out;
}

async function load() {
  const tk = document.getElementById('tk');
  try {
    const res = await fetch(DATA + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    let items = data.items || [];
    if (ONLY.length) items = items.filter(i => ONLY.includes(i.cat));
    items = interleave(items).slice(0, 50);

    if (!items.length) { tk.innerHTML = '<span class="msg">Geen items.</span>'; return; }

    document.getElementById('n').textContent = data.feeds_ok + '/' + data.feeds_tot;

    // Twee keer dezelfde reeks: de animatie schuift precies 50% op, dus
    // het einde sluit naadloos aan op het begin.
    const html = items.map(i => `
      <a class="it" data-c="${he(i.cat)}" href="${esc(i.url)}" target="_blank" rel="noopener">
        <span class="pip"></span>
        <span class="src">${he(i.src)}</span>
        <span class="hl">${he(i.title)}</span>
        <span class="age">${age(i.date)}</span>
      </a>`).join('');

    tk.classList.remove('run');
    tk.innerHTML = html + html;
    // Snelheid schalen met de hoeveelheid tekst, anders raast een korte
    // lijst voorbij en kruipt een lange.
    tk.style.setProperty('--dur', Math.round(SPEED * items.length / 40) + 's');
    requestAnimationFrame(() => tk.classList.add('run'));
  } catch (e) {
    tk.innerHTML = '<span class="msg">Kan data/feeds.json niet laden — ' + he(e.message) + '</span>';
  }
}

load();
setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
